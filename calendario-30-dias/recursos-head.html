<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recursos visuales · 30 días · Ecosistema Luis Flores</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0F;--s:#13131C;--s2:#1A1A26;--line:#26263A;--text:#EDEDF2;--muted:#9A9AB0;--p:#1D78FF;--n:#00D4FF;--sm:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Poppins,sans-serif;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:32px 18px 80px}
h1{font-family:Montserrat;font-weight:900;font-size:clamp(24px,4vw,34px)}p.lead{color:var(--muted);margin-top:10px;max-width:720px}
.bar{position:sticky;top:0;z-index:5;background:rgba(10,10,15,.92);backdrop-filter:blur(8px);padding:12px 0;margin-top:20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.btn{cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s);color:var(--muted);font:inherit;font-size:12.5px}
.chip.on{color:var(--text);border-color:var(--text)}.btn.primary{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:22px}
.item{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.item canvas{width:100%;height:auto;border-radius:8px;background:#000;display:block}
.meta{font-size:11.5px;color:var(--muted)}.meta b{color:var(--text)}
.row{display:flex;gap:6px;flex-wrap:wrap}.row button{flex:1;cursor:pointer;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--s2);color:var(--text);font:inherit;font-size:12px}
.row button:hover{border-color:var(--p)}.hide{display:none}
.daytag{grid-column:1/-1;font-family:Montserrat;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:10px;color:var(--muted)}
</style></head><body><div class="wrap">
<h1>Recursos visuales · 30 días</h1>
<p class="lead">Una portada lista por cada pieza con imagen (reels, videos, carruseles, PDF y posts con imagen), generada en HTML con el kit de cada marca. Descárgala en PNG al tamaño exacto o copia el texto. Los posts de solo texto de LinkedIn y Facebook no necesitan imagen.</p>
<div class="bar" id="bar">
 <button class="chip on" data-b="personal">Personal</button><button class="chip on" data-b="nova">Nova Funnels</button><button class="chip on" data-b="smilbot">Smilbot</button>
 <span style="flex:1"></span><button class="btn primary" id="zipBtn">Descargar todo (ZIP)</button><span class="meta" id="zipMsg"></span>
</div>
<div class="grid" id="grid"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
